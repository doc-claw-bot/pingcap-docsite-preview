name: Sync doc changes from multiple PRs

on:
  push:
    branches:
      - preview-multi-pr-sep-16-04
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  sync_mult_prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout current repo
      uses: actions/checkout@v5

    - name: Run sync_mult_prs script
      run: |
        git config user.name "Docsite Preview Bot"
        git config user.email ""
        ./sync_mult_prs.sh
        ./.github/git_push.sh ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MULTI_PR_REFS: |
          preview/pingcap/docs/23757
          preview/pingcap/docs-cn/21930
        RELEASE_DIR: release-8.5
        SINGLE_COMMIT: true
